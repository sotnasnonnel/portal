<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sistema PHD | Gestão de Horas Extras</title>
  <style>
    :root{--bg:#f4f6f8;--card:#fff;--text:#1f2937;--muted:#6b7280;--border:#d1d5db;--primary:#0f3d5e;--primary-2:#14537f;--success:#0f766e;--danger:#b91c1c;--warning:#b45309;--gray:#374151;--info:#1d4ed8}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}header{background:var(--primary);color:#fff;padding:18px 28px;display:flex;justify-content:space-between;align-items:center}header h1{margin:0;font-size:20px;font-weight:700}.app{display:grid;grid-template-columns:250px 1fr;min-height:calc(100vh - 64px)}nav{background:#fff;border-right:1px solid var(--border);padding:18px}nav button{width:100%;display:block;margin-bottom:10px;padding:12px;border:1px solid var(--border);background:#fff;color:var(--text);text-align:left;border-radius:8px;cursor:pointer;font-weight:600}nav button.active,nav button:hover{background:var(--primary);color:#fff;border-color:var(--primary)}main{padding:24px}.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:18px;box-shadow:0 1px 3px rgba(0,0,0,.05)}.grid{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:14px}.metric{background:#fff;border:1px solid var(--border);border-radius:12px;padding:18px}.metric span{color:var(--muted);font-size:13px}.metric strong{display:block;margin-top:8px;font-size:24px}label{display:block;font-size:13px;font-weight:700;margin-bottom:6px;color:var(--gray)}input,select,textarea{width:100%;padding:11px;border:1px solid var(--border);border-radius:8px;font-size:14px;background:#fff}textarea{min-height:90px;resize:vertical}.form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.form-grid .full{grid-column:1/-1}.actions{margin-top:16px;display:flex;gap:10px;flex-wrap:wrap}.btn{border:none;padding:11px 16px;border-radius:8px;color:#fff;background:var(--primary);font-weight:700;cursor:pointer}.btn:hover{background:var(--primary-2)}.btn.success{background:var(--success)}.btn.danger{background:var(--danger)}.btn.warning{background:var(--warning)}.btn.gray{background:var(--gray)}.btn.info{background:var(--info)}table{width:100%;border-collapse:collapse;margin-top:12px;font-size:14px}th,td{border-bottom:1px solid var(--border);padding:10px;text-align:left;vertical-align:top}th{background:#f9fafb;font-size:13px;color:var(--gray)}.badge{display:inline-block;padding:5px 8px;border-radius:999px;font-size:12px;font-weight:700;color:#fff}.pendente{background:var(--warning)}.aprovada,.compensada{background:var(--success)}.reprovada{background:var(--danger)}.cancelada,.fora{background:var(--gray)}.banco{background:#7c3aed}.medicao{background:#2563eb}.alert{padding:12px;border-radius:8px;margin-bottom:14px;border:1px solid var(--border);background:#fff7ed;color:#7c2d12;font-weight:600}.note{padding:12px;border-radius:8px;margin-bottom:14px;border:1px solid #bfdbfe;background:#eff6ff;color:#1e3a8a;font-weight:600}.hidden{display:none}.email-preview{background:#f9fafb;border:1px dashed var(--border);padding:14px;border-radius:8px;white-space:pre-line}.muted{color:var(--muted);font-size:13px}@media(max-width:900px){.app{grid-template-columns:1fr}nav{border-right:none;border-bottom:1px solid var(--border)}.grid,.form-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
<header><h1>Sistema PHD | Gestão de Horas Extras</h1><div><label style="color:#fff;display:inline;margin-right:8px;">Perfil:</label><select id="perfil" style="width:180px;" onchange="atualizarTela()"><option value="colaborador">Colaborador</option><option value="gestor">Gestor</option><option value="dpadmin">DP/Admin</option></select></div></header>
<div class="app"><nav>
<button id="btnDashboard" onclick="showPage('dashboard')">Dashboard</button>
<button id="btnNova" onclick="showPage('nova')">Nova Solicitação</button>
<button id="btnMinhas" onclick="showPage('minhas')">Minhas Solicitações</button>
<button id="btnAprovacoes" onclick="showPage('aprovacoes')">Aprovações Pendentes</button>
<button id="btnDP" onclick="showPage('dp')">Painel DP/Admin</button>
<button id="btnExcecoes" onclick="showPage('excecoes')">Central de Exceções</button>
<button id="btnAuditoria" onclick="showPage('auditoria')">Auditoria</button>
<button onclick="limparBase()" class="danger">Limpar Testes</button>
</nav><main>
<section id="dashboard" class="page"></section>
<section id="nova" class="page hidden"><div class="card"><h2>Nova Solicitação de Hora Extra</h2><div id="prazoMsg"></div><div class="form-grid">
<div><label>Colaborador</label><input id="colaborador" value="João Silva" /></div><div><label>Matrícula</label><input id="matricula" value="12345" /></div><div><label>Cargo</label><input id="cargo" value="Analista de Projetos" /></div>
<div><label>E-mail do Colaborador</label><input id="emailColaborador" value="colaborador@phd.com.br" /></div><div><label>Gestor</label><input id="gestor" value="Maria Gestora" /></div><div><label>E-mail do Gestor</label><input id="emailGestor" value="gestor@phd.com.br" /></div>
<div><label>Cliente/Projeto</label><input id="projeto" value="Projeto Cliente" /></div><div><label>Equipe</label><input id="equipe" value="Equipe de Campo" /></div><div><label>Centro de Custo</label><input id="centroCusto" value="Engenharia" /></div>
<div><label>Data da Hora Extra</label><input id="dataHE" type="date" /></div><div><label>Hora Início</label><input id="horaInicio" type="time" value="18:00" /></div><div><label>Hora Fim</label><input id="horaFim" type="time" value="20:00" /></div>
<div><label>Motivo</label><select id="motivo" onchange="toggleOutro()"><option>Atendimento ao cliente</option><option>Entrega de projeto</option><option>Fechamento mensal</option><option>Atividade emergencial</option><option>Treinamento</option><option>Reunião extraordinária</option><option>Outro</option></select></div>
<div id="outroBox" class="hidden full"><label>Descrever outro motivo</label><input id="outroMotivo" /></div><div class="full"><label>Justificativa obrigatória</label><textarea id="justificativa">Atendimento emergencial solicitado pelo cliente.</textarea></div>
</div><div class="actions"><button class="btn success" onclick="criarSolicitacao()">Enviar Solicitação</button></div></div><div class="card"><h3>Prévia do E-mail ao Gestor</h3><div class="email-preview" id="emailPreview"></div></div></section>
<section id="minhas" class="page hidden"></section><section id="aprovacoes" class="page hidden"></section><section id="dp" class="page hidden"></section><section id="excecoes" class="page hidden"></section><section id="auditoria" class="page hidden"></section>
</main></div>
<script>
const STORAGE_KEY='phd_horas_extras_v2';
function hojeISO(){return new Date().toISOString().slice(0,10)}
function agoraBR(){return new Date().toLocaleString('pt-BR')}
function gerarId(){return String(Date.now()).slice(-6)}
function dataPadrao(){return JSON.parse('{"solicitacoes":[],"auditoria":[],"excecoes":[]}')}
function loadData(){let d=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');if(!d){d=dataPadrao()}d.solicitacoes=d.solicitacoes||[];d.auditoria=d.auditoria||[];d.excecoes=d.excecoes||[];return d}
function saveData(data){localStorage.setItem(STORAGE_KEY,JSON.stringify(data))}
function auditar(acao,detalhe){const data=loadData();data.auditoria.unshift({dataHora:agoraBR(),perfil:document.getElementById('perfil').value,acao,detalhe});saveData(data)}
function statusBadge(status){let c='pendente';if(status.includes('Medição'))c='medicao';if(status.includes('Banco'))c='banco';if(status==='Compensada')c='compensada';if(status==='Aprovada')c='aprovada';if(status==='Reprovada')c='reprovada';if(status==='Cancelada')c='cancelada';return `<span class="badge ${c}">${status}</span>`}
function calcularHoras(inicio,fim){const[hi,mi]=inicio.split(':').map(Number);const[hf,mf]=fim.split(':').map(Number);let total=(hf*60+mf)-(hi*60+mi);if(total<=0)return'00:00';return `${String(Math.floor(total/60)).padStart(2,'0')}:${String(total%60).padStart(2,'0')}`}
function horarioParaMin(h){const[a,b]=h.split(':').map(Number);return a*60+b}
function entreDatas(data,ini,fim){return(!ini||data>=ini)&&(!fim||data<=fim)}
function excecaoAtiva(dataHE,colaborador,equipe,projeto){const d=loadData();const hoje=hojeISO();return d.excecoes.find(e=>e.ativa!==false&&entreDatas(dataHE,e.dataInicial,e.dataFinal)&&(e.tipo==='global'||(e.tipo==='colaborador'&&e.colaborador?.toLowerCase()===colaborador?.toLowerCase())||(e.tipo==='equipe'&&(e.equipe?.toLowerCase()===equipe?.toLowerCase()||e.projeto?.toLowerCase()===projeto?.toLowerCase()))))}
function validarPrazo(dataHE){const now=new Date();const today=hojeISO();const col=document.getElementById('colaborador')?.value||'';const eq=document.getElementById('equipe')?.value||'';const proj=document.getElementById('projeto')?.value||'';if(dataHE<today)return{ok:false,msg:'Solicitação retroativa não permitida.'};let limite='12:00';let fonte='regra padrão';const ex=excecaoAtiva(dataHE,col,eq,proj);if(ex){limite=ex.novoHorario;fonte=`exceção ativa: ${ex.tipo}`}
if(dataHE===today&&horarioParaMin(now.toTimeString().slice(0,5))>horarioParaMin(limite)){return{ok:false,msg:`Solicitação não permitida. Prazo encerrado às ${limite} (${fonte}).`}}
return{ok:true,msg:`Dentro do prazo para solicitação. Horário limite: ${limite} (${fonte}).`}}
function toggleOutro(){document.getElementById('outroBox').classList.toggle('hidden',document.getElementById('motivo').value!=='Outro')}
function atualizarEmailPreview(){const nome=colaborador.value,mat=matricula.value,proj=projeto.value,cc=centroCusto.value,data=dataHE.value,ini=horaInicio.value,fim=horaFim.value,just=justificativa.value,total=calcularHoras(ini,fim);emailPreview.innerText=`Assunto: Solicitação de Hora Extra Pendente de Aprovação\n\nPrezado(a) Gestor(a),\n\nExiste uma solicitação de hora extra pendente de aprovação.\n\nColaborador: ${nome}\nMatrícula: ${mat}\nProjeto/Cliente: ${proj}\nCentro de Custo: ${cc}\nData: ${data||'-'}\nHorário previsto: ${ini} às ${fim}\nQuantidade estimada: ${total}\nJustificativa: ${just}\n\nNa aprovação, o gestor deverá informar o destino da hora:\n[ Medição/Pagamento ] ou [ Banco de Horas ]\n\nObservação: o percentual será aplicado pelo DP/RM conforme CCT vigente.\n\nAções disponíveis no e-mail:\n[ Aprovar ] [ Reprovar ]`}
function criarSolicitacao(){const validacao=validarPrazo(dataHE.value);if(!dataHE.value)return alert('Informe a data da hora extra.');if(!validacao.ok){alert(validacao.msg);auditar('Tentativa bloqueada',validacao.msg);return}const motivo=motivoEl().value,outro=outroMotivo.value.trim(),just=justificativa.value.trim();if(motivo==='Outro'&&!outro)return alert('Descreva o outro motivo.');if(!just)return alert('A justificativa é obrigatória.');const data=loadData();const s={id:gerarId(),colaborador:colaborador.value,matricula:matricula.value,cargo:cargo.value,emailColaborador:emailColaborador.value,gestor:gestor.value,emailGestor:emailGestor.value,projeto:projeto.value,equipe:equipe.value,centroCusto:centroCusto.value,dataHE:dataHE.value,horaInicio:horaInicio.value,horaFim:horaFim.value,totalHoras:calcularHoras(horaInicio.value,horaFim.value),motivo:motivo==='Outro'?outro:motivo,justificativa:just,status:'Pendente de Aprovação',destinoHora:'',dataCompensacao:'',periodoCompensacao:'',quantidadeCompensacao:'',definidoPor:'',observacaoDestino:'',criadoEm:agoraBR(),aprovadoEm:'',aprovadoPor:'',motivoReprovacao:''};data.solicitacoes.unshift(s);data.auditoria.unshift({dataHora:agoraBR(),perfil:'colaborador',acao:'Solicitação criada',detalhe:`Solicitação #${s.id} criada e e-mail enviado ao gestor ${s.emailGestor}`});saveData(data);alert('Solicitação criada. E-mail ao gestor simulado com sucesso.');renderAll();showPage('minhas')}
function motivoEl(){return document.getElementById('motivo')}
function aprovar(id){const data=loadData();const s=data.solicitacoes.find(x=>x.id===id);if(!s)return;let destino=prompt('Destino da hora extra:\n1 - Medição/Pagamento\n2 - Banco de Horas\n\nDigite 1 ou 2:');if(!destino)return;if(destino==='1'){s.destinoHora='Medição/Pagamento';s.status='Aprovada - Medição/Pagamento';s.observacaoDestino=prompt('Observação do gestor para medição/pagamento (opcional):')||''}else if(destino==='2'){const dt=prompt('Informe a data prevista para compensação (AAAA-MM-DD):');if(!dt)return alert('Data prevista de compensação é obrigatória.');const per=prompt('Período previsto: manhã, tarde ou dia inteiro:');if(!per)return alert('Período é obrigatório.');const qtd=prompt('Quantidade prevista para compensação (ex: 02:00):',s.totalHoras);if(!qtd)return alert('Quantidade é obrigatória.');s.destinoHora='Banco de Horas';s.status='Aprovada - Banco de Horas';s.dataCompensacao=dt;s.periodoCompensacao=per;s.quantidadeCompensacao=qtd;s.definidoPor='Gestor';s.observacaoDestino=prompt('Observação sobre a compensação (opcional):')||''}else{return alert('Opção inválida.')}s.aprovadoEm=agoraBR();s.aprovadoPor=s.gestor;data.auditoria.unshift({dataHora:agoraBR(),perfil:'gestor',acao:'Aprovação com destino da hora',detalhe:`Solicitação #${id} aprovada. Destino: ${s.destinoHora}. Percentual conforme CCT/DP.`});saveData(data);renderAll()}
function reprovar(id){const motivo=prompt('Informe o motivo da reprovação:');if(!motivo)return alert('Motivo obrigatório para reprovação.');const data=loadData();const s=data.solicitacoes.find(x=>x.id===id);if(!s)return;s.status='Reprovada';s.aprovadoEm=agoraBR();s.aprovadoPor=s.gestor;s.motivoReprovacao=motivo;data.auditoria.unshift({dataHora:agoraBR(),perfil:'gestor',acao:'Reprovação por e-mail simulada',detalhe:`Solicitação #${id} reprovada. Motivo: ${motivo}`});saveData(data);renderAll()}
function cancelar(id){const motivo=prompt('Informe o motivo do cancelamento:');if(!motivo)return alert('Motivo obrigatório.');const data=loadData();const s=data.solicitacoes.find(x=>x.id===id);if(!s)return;s.status='Cancelada';data.auditoria.unshift({dataHora:agoraBR(),perfil:'dpadmin',acao:'Cancelamento DP/Admin',detalhe:`Solicitação #${id} cancelada. Motivo: ${motivo}`});saveData(data);renderAll()}
function alterarDestino(id){const data=loadData();const s=data.solicitacoes.find(x=>x.id===id);if(!s)return;const motivo=prompt('Motivo da alteração do destino:');if(!motivo)return alert('Motivo obrigatório.');let destino=prompt('Novo destino:\n1 - Medição/Pagamento\n2 - Banco de Horas');if(destino==='1'){s.destinoHora='Medição/Pagamento';s.status='Aprovada - Medição/Pagamento';s.dataCompensacao='';s.periodoCompensacao='';s.quantidadeCompensacao=''}else if(destino==='2'){s.destinoHora='Banco de Horas';s.status='Aprovada - Banco de Horas';s.dataCompensacao=prompt('Data prevista de compensação (AAAA-MM-DD):')||'';s.periodoCompensacao=prompt('Período previsto:')||'';s.quantidadeCompensacao=prompt('Quantidade prevista:',s.totalHoras)||s.totalHoras}else{return alert('Opção inválida.')}data.auditoria.unshift({dataHora:agoraBR(),perfil:'dpadmin',acao:'Alteração de destino DP/Admin',detalhe:`Solicitação #${id} alterada para ${s.destinoHora}. Motivo: ${motivo}`});saveData(data);renderAll()}
function marcarCompensada(id){const data=loadData();const s=data.solicitacoes.find(x=>x.id===id);if(!s)return;s.status='Compensada';data.auditoria.unshift({dataHora:agoraBR(),perfil:'dpadmin',acao:'Compensação registrada',detalhe:`Solicitação #${id} marcada como compensada.`});saveData(data);renderAll()}
function tabelaSolicitacoes(lista,actions=false,dp=false){if(!lista.length)return'<p>Nenhuma solicitação encontrada.</p>';return `<table><thead><tr><th>ID</th><th>Colaborador</th><th>Projeto/Equipe</th><th>Data</th><th>Horário</th><th>Total</th><th>Destino</th><th>Status</th><th>Justificativa/Compensação</th>${actions||dp?'<th>Ações</th>':''}</tr></thead><tbody>${lista.map(s=>`<tr><td>#${s.id}</td><td>${s.colaborador}<br><small>${s.matricula}</small></td><td>${s.projeto}<br><small>${s.equipe||'-'} | ${s.centroCusto}</small></td><td>${s.dataHE}</td><td>${s.horaInicio} às ${s.horaFim}</td><td>${s.totalHoras}</td><td>${s.destinoHora||'-'}<br><small>Percentual conforme CCT/DP</small></td><td>${statusBadge(s.status)}</td><td>${s.justificativa}${s.dataCompensacao?`<br><b>Compensação:</b> ${s.dataCompensacao} | ${s.periodoCompensacao} | ${s.quantidadeCompensacao}`:''}${s.motivoReprovacao?'<br><b>Reprovação:</b> '+s.motivoReprovacao:''}</td>${actions||dp?`<td>${actions&&s.status==='Pendente de Aprovação'?`<button class="btn success" onclick="aprovar('${s.id}')">Aprovar</button> <button class="btn danger" onclick="reprovar('${s.id}')">Reprovar</button>`:''}${dp&&s.status!=='Cancelada'?`<button class="btn info" onclick="alterarDestino('${s.id}')">Alterar destino</button> <button class="btn gray" onclick="cancelar('${s.id}')">Cancelar</button>`:''}${dp&&s.status==='Aprovada - Banco de Horas'?`<button class="btn success" onclick="marcarCompensada('${s.id}')">Compensada</button>`:''}</td>`:''}</tr>`).join('')}</tbody></table>`}
function renderDashboard(){const data=loadData(),list=data.solicitacoes;const med=list.filter(s=>s.destinoHora==='Medição/Pagamento').length,banco=list.filter(s=>s.destinoHora==='Banco de Horas').length,pend=list.filter(s=>s.status==='Pendente de Aprovação').length,exc=data.excecoes.filter(e=>e.ativa!==false).length;dashboard.innerHTML=`<div class="card"><h2>Dashboard de Horas Extras</h2><div class="grid"><div class="metric"><span>Solicitações</span><strong>${list.length}</strong></div><div class="metric"><span>Pendentes</span><strong>${pend}</strong></div><div class="metric"><span>Medição/Pagamento</span><strong>${med}</strong></div><div class="metric"><span>Banco de Horas</span><strong>${banco}</strong></div><div class="metric"><span>Exceções Ativas</span><strong>${exc}</strong></div><div class="metric"><span>Controle Padrão</span><strong>12h00</strong></div><div class="metric"><span>Perfis</span><strong>3</strong></div><div class="metric"><span>Auditoria</span><strong>${data.auditoria.length}</strong></div></div></div><div class="card"><h3>Últimas Solicitações</h3>${tabelaSolicitacoes(list.slice(0,5))}</div>`}
function renderMinhas(){minhas.innerHTML=`<div class="card"><h2>Minhas Solicitações</h2>${tabelaSolicitacoes(loadData().solicitacoes)}</div>`}
function renderAprovacoes(){const pend=loadData().solicitacoes.filter(s=>s.status==='Pendente de Aprovação');aprovacoes.innerHTML=`<div class="card"><h2>Aprovações Pendentes</h2><div class="alert">Na aprovação, o gestor deve definir se a hora será para Medição/Pagamento ou Banco de Horas. Percentual não é informado pelo gestor; será aplicado conforme CCT e parametrização do DP.</div>${tabelaSolicitacoes(pend,true,false)}</div>`}
function renderDP(){const data=loadData();dp.innerHTML=`<div class="card"><h2>Painel DP/Admin</h2><div class="note">DP/Admin pode alterar o destino da hora, cancelar solicitação, marcar banco como compensado e gerenciar exceções de prazo.</div><div class="actions"><button class="btn warning" onclick="showPage('excecoes')">Central de Exceções</button><button class="btn" onclick="exportarCSV()">Exportar Excel/CSV</button></div>${tabelaSolicitacoes(data.solicitacoes,false,true)}</div>`}
function renderExcecoes(){const data=loadData();excecoes.innerHTML=`<div class="card"><h2>Central de Exceções de Prazo</h2><div class="alert">Regra padrão: solicitações até 12h00. DP/Admin pode liberar exceções com rastreabilidade.</div><div class="form-grid"><div><label>Tipo de liberação</label><select id="excTipo"><option value="solicitacao">1. Solicitação específica</option><option value="colaborador">2. Colaborador por período</option><option value="equipe">3. Equipe/Projeto por período</option><option value="global">4. Horário global do dia</option></select></div><div><label>Novo horário limite</label><input id="excHorario" type="time" value="15:00"></div><div><label>Data inicial</label><input id="excDataInicial" type="date" value="${hojeISO()}"></div><div><label>Data final</label><input id="excDataFinal" type="date" value="${hojeISO()}"></div><div><label>ID da solicitação</label><input id="excSolicitacao" placeholder="Opcional"></div><div><label>Colaborador</label><input id="excColaborador" placeholder="Nome exato"></div><div><label>Equipe</label><input id="excEquipe" placeholder="Equipe de Campo"></div><div><label>Projeto</label><input id="excProjeto" placeholder="Projeto Cliente"></div><div class="full"><label>Motivo da exceção</label><textarea id="excMotivo" placeholder="Ex.: colaborador em campo sem acesso ao sistema, indisponibilidade do sistema, queda de energia..."></textarea></div></div><div class="actions"><button class="btn success" onclick="criarExcecao()">Salvar Exceção</button></div></div><div class="card"><h3>Exceções registradas</h3>${data.excecoes.length?`<table><thead><tr><th>Tipo</th><th>Período</th><th>Limite</th><th>Escopo</th><th>Motivo</th><th>Status</th></tr></thead><tbody>${data.excecoes.map(e=>`<tr><td>${e.tipo}</td><td>${e.dataInicial} a ${e.dataFinal}</td><td>${e.novoHorario}</td><td>${e.solicitacaoId||e.colaborador||e.equipe||e.projeto||'Toda empresa'}</td><td>${e.motivo}</td><td>${e.ativa===false?'Inativa':'Ativa'}</td></tr>`).join('')}</tbody></table>`:'<p>Nenhuma exceção registrada.</p>'}</div>`}
function criarExcecao(){const data=loadData();const e={id:gerarId(),tipo:excTipo.value,novoHorario:excHorario.value,dataInicial:excDataInicial.value,dataFinal:excDataFinal.value,solicitacaoId:excSolicitacao.value.trim(),colaborador:excColaborador.value.trim(),equipe:excEquipe.value.trim(),projeto:excProjeto.value.trim(),motivo:excMotivo.value.trim(),criadoEm:agoraBR(),criadoPor:'DP/Admin',ativa:true};if(!e.motivo)return alert('Informe o motivo da exceção.');if(e.tipo==='colaborador'&&!e.colaborador)return alert('Informe o colaborador.');if(e.tipo==='equipe'&&!e.equipe&&!e.projeto)return alert('Informe equipe ou projeto.');if(e.tipo==='solicitacao'&&!e.solicitacaoId)return alert('Informe o ID da solicitação.');data.excecoes.unshift(e);data.auditoria.unshift({dataHora:agoraBR(),perfil:'dpadmin',acao:'Exceção de prazo criada',detalhe:`Tipo: ${e.tipo}. Limite: ${e.novoHorario}. Motivo: ${e.motivo}`});saveData(data);renderAll();alert('Exceção registrada com sucesso.')}
function renderAuditoria(){const data=loadData();auditoria.innerHTML=`<div class="card"><h2>Auditoria</h2>${data.auditoria.length?`<table><thead><tr><th>Data/Hora</th><th>Perfil</th><th>Ação</th><th>Detalhe</th></tr></thead><tbody>${data.auditoria.map(a=>`<tr><td>${a.dataHora}</td><td>${a.perfil}</td><td>${a.acao}</td><td>${a.detalhe}</td></tr>`).join('')}</tbody></table>`:'<p>Nenhum registro de auditoria.</p>'}</div>`}
function exportarCSV(){const data=loadData();const headers=['ID','Colaborador','Matricula','Projeto','Equipe','Centro de Custo','Data','Inicio','Fim','Total','Destino','Status','Data Compensacao','Periodo Compensacao','Qtd Compensacao','Justificativa','Aprovado Em','Aprovado Por'];const rows=data.solicitacoes.map(s=>[s.id,s.colaborador,s.matricula,s.projeto,s.equipe,s.centroCusto,s.dataHE,s.horaInicio,s.horaFim,s.totalHoras,s.destinoHora,s.status,s.dataCompensacao,s.periodoCompensacao,s.quantidadeCompensacao,s.justificativa,s.aprovadoEm,s.aprovadoPor]);const csv=[headers,...rows].map(r=>r.map(v=>`"${String(v||'').replaceAll('"','""')}"`).join(';')).join('\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='horas_extras_phd.csv';a.click();URL.revokeObjectURL(url)}
function limparBase(){if(!confirm('Deseja limpar todos os testes?'))return;localStorage.removeItem(STORAGE_KEY);renderAll()}
function showPage(id){document.querySelectorAll('.page').forEach(p=>p.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));const btn=document.getElementById('btn'+id.charAt(0).toUpperCase()+id.slice(1));if(btn)btn.classList.add('active');renderAll()}
function atualizarTela(){const p=perfil.value;btnNova.style.display=p==='colaborador'||p==='dpadmin'?'block':'none';btnMinhas.style.display=p==='colaborador'||p==='dpadmin'?'block':'none';btnAprovacoes.style.display=p==='gestor'||p==='dpadmin'?'block':'none';btnDP.style.display=p==='dpadmin'?'block':'none';btnExcecoes.style.display=p==='dpadmin'?'block':'none';btnAuditoria.style.display=p==='dpadmin'?'block':'none'}
function renderAll(){const dataInput=document.getElementById('dataHE');if(dataInput&&!dataInput.value)dataInput.value=hojeISO();if(prazoMsg&&dataInput){const prazo=validarPrazo(dataInput.value);prazoMsg.innerHTML=`<div class="alert">${prazo.msg}</div>`}atualizarEmailPreview();renderDashboard();renderMinhas();renderAprovacoes();renderDP();renderExcecoes();renderAuditoria();atualizarTela()}
document.addEventListener('input',()=>{try{atualizarEmailPreview();const dataInput=document.getElementById('dataHE');if(dataInput&&prazoMsg){const prazo=validarPrazo(dataInput.value);prazoMsg.innerHTML=`<div class="alert">${prazo.msg}</div>`}}catch(e){}});document.addEventListener('DOMContentLoaded',()=>{dataHE.value=hojeISO();renderAll();showPage('dashboard')});
</script>
</body>
</html>
